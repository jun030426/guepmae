name: daily-trades-refresh

on:
  schedule:
    - cron: '30 18 * * *' # 03:30 KST
  workflow_dispatch:
    inputs:
      months:
        description: '최근 재수집 개월 수 (0: 저장된 원본 검증, 3: 매일 갱신, 36: 전량 갱신)'
        default: '3'
      dry_run:
        description: '수집·집계·검증만 실행하고 운영 데이터는 변경하지 않음'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: trades-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || vars.TRADES_REFRESH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MONTHS: ${{ inputs.months || '3' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      SUPABASE_URL: https://oormfipegcfbhvctikfl.supabase.co
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: npm ci
      - name: 파이프라인 회귀 검사
        run: |
          node --test scripts/market-dataset.test.mjs supabase/tests/market-publish.test.mjs
          python -m unittest scripts/test_fetch_market_trades.py scripts/test_fetch_report_trades.py
      - name: 비공개 원본 내려받기
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/publish-market-dataset.mjs download
      - name: 현재 행정구역으로 수집
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: python scripts/fetch-market-trades.py --refresh-months "$MONTHS"
      - name: 전체 검증 및 집계
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: node scripts/build-market-dataset.mjs
      - name: 원자적 운영 반영
        if: env.DRY_RUN != 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/publish-market-dataset.mjs publish
      - name: 결과 기록
        if: always()
        run: |
          echo '### 급매 실거래 갱신' >> "$GITHUB_STEP_SUMMARY"
          echo "- 결과: ${{ job.status }} / dry_run: $DRY_RUN / months: $MONTHS" >> "$GITHUB_STEP_SUMMARY"
          if [ -f scripts/output/market/manifest.json ]; then
            node -e 'const m=JSON.parse(require("fs").readFileSync("scripts/output/market/manifest.json"));console.log("- 수집: "+m.source.start+" ~ "+m.source.end+" / "+m.source.completedPairs+"개 시군구·월");for(const [name,t] of Object.entries(m.tables))console.log("- "+name+": "+t.rows+"행")' >> "$GITHUB_STEP_SUMMARY"
          fi
